<!doctype html>
<html lang="ko" data-theme="dark" data-preset="classic">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book-Publisher 워크플로우 · 인터랙티브 도식</title>
<meta name="description" content="AI 다중 에이전트 집필부터 Puvles 사람 검토 게이트, 책 웹·PPT·발표자료 사이트까지 — Book-Publisher 출판 파이프라인을 탐색하는 인터랙티브 도식." />
<style>
  :root{
    --bg:#0f1420; --bg2:#0b0f18; --surface:#181f2e; --surface2:#1f2838;
    --text:#e8edf6; --muted:#94a3b8; --line:#2a3448; --edge:#8291aa;
    --panel:#141a27; --panelbd:#26324a; --chip:#22304a; --accent:#38bdf8;
    --grid:transparent;
  }
  html[data-theme="light"]{
    --bg:#f4f6fb; --bg2:#eef1f8; --surface:#ffffff; --surface2:#f7f9fd;
    --text:#111826; --muted:#5b6b86; --line:#d5dded; --edge:#7c8aa5;
    --panel:#ffffff; --panelbd:#e2e8f5; --chip:#eef2fb; --accent:#0284c7;
    --grid:transparent;
  }
  html[data-preset="blueprint"][data-theme="dark"]{ --bg:#071426; --bg2:#050f1d; --surface:#0c2036; --surface2:#0f2744; --text:#dbeafe; --muted:#7fa9d6; --line:#1d4670; --edge:#4f83bd; --panel:#0a1c31; --panelbd:#1b3d63; --chip:#123350; --grid:#123156; }
  html[data-preset="blueprint"][data-theme="light"]{ --bg:#eaf2fb; --bg2:#e0ecf9; --surface:#ffffff; --surface2:#f2f7fd; --text:#0b2545; --muted:#3f6491; --line:#bcd3ef; --edge:#5b83b3; --panel:#ffffff; --panelbd:#cfe0f4; --chip:#e4eefb; --grid:#cadcf3; }
  html[data-preset="signal"][data-theme="dark"]{ --bg:#080a12; --bg2:#05070d; --surface:#12151f; --surface2:#171b28; --text:#f0f4ff; --muted:#8b96b5; --line:#242a3d; --edge:#9aa6c8; --panel:#0d101a; --panelbd:#20263a; --chip:#1a2136; }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Pretendard","Segoe UI",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
  }
  .app{display:flex; flex-direction:column; height:100vh; min-height:0}
  header.bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 18px; border-bottom:1px solid var(--line); background:var(--bg2);
  }
  .brand{display:flex; flex-direction:column; gap:2px; margin-right:auto}
  .brand h1{font-size:16px; margin:0; letter-spacing:-.2px}
  .brand p{margin:0; font-size:12px; color:var(--muted)}
  .controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .ctl{
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:7px 11px; font-size:12.5px; line-height:1;
    transition:border-color .15s, background .15s, transform .05s;
  }
  .ctl:hover{border-color:var(--accent)}
  .ctl:active{transform:translateY(1px)}
  .ctl.on{border-color:var(--accent); color:var(--accent)}
  select.ctl{appearance:none; padding-right:22px; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  .main{display:flex; flex:1; min-height:0}
  .stage{position:relative; flex:1; min-width:0; overflow:hidden; background:
      radial-gradient(circle at 20% 0%, color-mix(in srgb,var(--accent) 7%, transparent), transparent 45%),
      var(--bg)}
  svg#diagram{width:100%; height:100%; display:block; touch-action:none; cursor:grab}
  svg#diagram.grab{cursor:grabbing}
  .gridlayer{stroke:var(--grid); stroke-width:1}
  /* interactivity classes (kept in-svg for export safety) */
  .node,.edge,.edgelabel{transition:opacity .18s}
  .dim{opacity:.14}
  .edge.dim{opacity:.07}
  .node .card{transition:filter .15s, stroke-width .15s}
  .node.sel .card{stroke-width:2.4px; filter:drop-shadow(0 0 0 transparent)}
  .node{cursor:pointer}
  .edge path{fill:none}
  .trace .edge path.flow{stroke-dasharray:7 9; animation:dash 1.1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-32}}
  aside.panel{
    width:340px; flex:0 0 340px; border-left:1px solid var(--line);
    background:var(--panel); display:flex; flex-direction:column; min-height:0;
  }
  .panel .scroll{overflow:auto; padding:16px 16px 22px}
  .p-hint{color:var(--muted); font-size:13px; line-height:1.6}
  .p-kicker{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
  .p-title{font-size:17px; margin:0 0 10px; letter-spacing:-.2px; line-height:1.3}
  .p-meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
  .tag{font-size:11.5px; padding:4px 9px; border-radius:999px; background:var(--chip); color:var(--text); border:1px solid var(--panelbd); display:inline-flex; gap:5px; align-items:center}
  .tag b{font-weight:700}
  .p-body{font-size:13.5px; line-height:1.72; color:var(--text)}
  .p-sec{margin-top:14px}
  .p-sec h4{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 6px}
  .p-list{margin:0; padding-left:0; list-style:none; font-size:12.5px; line-height:1.6}
  .p-list li{padding:5px 0 5px 16px; position:relative; color:var(--text)}
  .p-list li::before{content:""; position:absolute; left:0; top:12px; width:6px; height:6px; border-radius:2px; background:var(--accent)}
  code.path{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11.5px; background:var(--chip); padding:1.5px 5px; border-radius:5px; border:1px solid var(--panelbd)}
  .legend{border-top:1px solid var(--line); padding:12px 16px; background:var(--panel)}
  .legend h4{margin:0 0 8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .legend .row{display:flex; flex-wrap:wrap; gap:6px 12px}
  .legend .li{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
  .legend .sw{width:12px; height:12px; border-radius:3px}
  footer.foot{padding:8px 18px; border-top:1px solid var(--line); background:var(--bg2); font-size:11.5px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; align-items:center}
  footer.foot a{color:var(--accent); text-decoration:none}
  footer.foot a:hover{text-decoration:underline}
  .spacer{flex:1}
  @media (max-width:820px){
    .main{flex-direction:column}
    aside.panel{width:auto; flex:0 0 auto; max-height:44vh; border-left:none; border-top:1px solid var(--line)}
    .brand h1{font-size:14px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>Book-Publisher 워크플로우</h1>
      <p>AI 다중 에이전트 집필 → 사람 검토 게이트 → 책 웹·PPT·발표자료 · 노드를 눌러 탐색하세요</p>
    </div>
    <div class="controls">
      <select class="ctl" id="preset" title="시각 프리셋">
        <option value="classic">Classic</option>
        <option value="signal">Signal Flow</option>
        <option value="blueprint">Blueprint</option>
      </select>
      <button class="ctl" id="theme" title="테마 전환">🌙 <span>Dark</span></button>
      <button class="ctl" id="trace" title="흐름 애니메이션">▶ 흐름</button>
      <button class="ctl" id="reset" title="보기 초기화">⟲ 보기</button>
      <button class="ctl" id="pngbtn" title="PNG 내보내기">↧ PNG</button>
      <button class="ctl" id="svgbtn" title="SVG 내보내기">↧ SVG</button>
    </div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <aside class="panel">
      <div class="scroll" id="detail">
        <p class="p-kicker">안내</p>
        <p class="p-title">단계를 선택하세요</p>
        <p class="p-hint">각 노드를 클릭하면 그 단계의 완료 근거와 산출물을 볼 수 있습니다. 노드에 마우스를 올리면 연결된 경로가 강조됩니다. 마우스 휠로 확대/축소, 빈 곳을 끌어 이동합니다.</p>
      </div>
      <div class="legend" id="legend"></div>
    </aside>
  </div>
  <footer class="foot">
    <span id="footnote">사람 검토 게이트 ★ 는 자동이 아닙니다 — 여기서 멈추고 보고합니다.</span>
    <span class="spacer"></span>
    <span>Inspired by <a href="https://github.com/tt-a1i/archify" target="_blank" rel="noopener">archify</a> (MIT)</span>
  </footer>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Book-Publisher workflow — interactive diagram (self-contained)
 * Engine is shared with the public repo version; only WF data differs.
 * ------------------------------------------------------------------ */
const WF = {
  meta:{ w:1000, h:980,
    title:"Book Publisher Workflow",
    subtitle:"Brief → Research → Plan → Draft → Editorial QA → Release · 노드를 눌러 완료 근거를 확인하세요",
    foot:"각 단계는 완료 근거(evidence)를 book-project.json에 남긴 뒤에만 complete로 바뀝니다.",
    doctitle:"Book Publisher Workflow · 인터랙티브 도식" },
  kinds:{
    map:     {c:"#64748b", ko:"단일 지도"},
    brief:   {c:"#6366f1", ko:"Brief 브리프"},
    research:{c:"#0ea5e9", ko:"Research 조사"},
    plan:    {c:"#8b5cf6", ko:"Plan 구성"},
    draft:   {c:"#3b82f6", ko:"Draft 집필"},
    qa:      {c:"#f59e0b", ko:"Editorial QA"},
    release: {c:"#22c55e", ko:"Release 출간"},
    optional:{c:"#14b8a6", ko:"선택 산출물"}
  },
  nodes:[
    {id:"MAP", cx:500, y:40, kind:"map", lines:["book-project.json","단일 지도"],
     detail:{kicker:"프로젝트 지도", tags:[["상태","not_started · in_progress · blocked · complete"]],
       body:"전 단계의 상태·근거·산출물 경로를 잇는 프로젝트의 단일 지도입니다. 원고를 한 번 생성하는 프롬프트가 아니라, 완료 근거를 남기며 다음 단계로 이동하는 작업 체계입니다.",
       gate:"각 단계를 complete로 바꾸기 전에 근거 파일 경로를 최소 1개 추가"}},

    {id:"B", cx:500, y:150, kind:"brief", lines:["1 · Brief","브리프"],
     detail:{kicker:"1단계 · Brief", tags:[["산출물","brief.md"]],
       body:"독자와 그의 문제, 약속한 변화, 범위 경계, 문체, 형식, 산출물을 정의합니다.",
       gate:"brief.md에 자리표시자가 없고 목차가 약속을 지지"}},

    {id:"R", cx:500, y:258, kind:"research", lines:["2 · Research","조사"],
     detail:{kicker:"2단계 · Research", tags:[["산출물","research/sources.md"]],
       body:"출처 원장을 만들고 출처 사실·저자 해석·예시를 분리합니다.",
       gate:"근거가 필요한 주장에 출처가 있거나 qa/open-issues.md에 기록"}},

    {id:"P", cx:500, y:366, kind:"plan", lines:["3 · Plan","구성"],
     detail:{kicker:"3단계 · Plan", tags:[["단위","장별 브리프"]],
       body:"장별 브리프를 만듭니다 — 결과 1개, 핵심 아이디어 최대 3개, 예시, 의존성.",
       gate:"모든 계획 장이 책의 약속에 기여하고 관찰 가능한 독자 결과를 가짐"}},

    {id:"D", cx:500, y:474, kind:"draft", lines:["4 · Draft","집필"],
     detail:{kicker:"4단계 · Draft", tags:[["위치","manuscript/"]],
       body:"manuscript/에 장별 Markdown으로 씁니다. 개념을 예시·연습 옆에 둡니다.",
       gate:"계획 장 모두 존재 · 상호참조 해결 · scaffold placeholder 0"}},

    {id:"Q", cx:500, y:582, kind:"qa", lines:["5 · Editorial QA","편집 검수"],
     detail:{kicker:"5단계 · Editorial QA", tags:[["기록","qa/"]],
       body:"구조·독자 경험·사실 근거·연속성·언어·자산 권리를 개별 패스로 검수합니다. 집필과 검수는 분리합니다.",
       gate:"blocking 항목 해결 · 수용한 한계는 명시"}},

    {id:"REL", cx:500, y:690, kind:"release", lines:["6 · Release","출간"],
     detail:{kicker:"6단계 · Release", tags:[["위치","dist/"]],
       body:"승인된 원고에서 요청 형식을 만듭니다. 생성물은 dist/에 두고 경로·체크섬을 근거로 기록합니다.",
       gate:"파일 정상 오픈 · 내비게이션 동작 · 원고/자산 일치"}},

    {id:"PRES", cx:300, y:820, kind:"optional", lines:["선택 · Presentation","발표자료"],
     detail:{kicker:"선택 산출물", tags:[["파생","승인된 원고"]],
       body:"지정한 청중·시간에 맞춘 발표 아크를 설계합니다. 슬라이드 1장에 1아이디어, 발표자 노트는 자연스러운 구어 브리지·예시·행동을 담습니다.",
       gate:"슬라이드 가독성과 내보낸 PDF를 개별 검증"}},

    {id:"WEB", cx:700, y:820, kind:"optional", lines:["선택 · Website","웹사이트"],
     detail:{kicker:"선택 산출물", tags:[["파생","승인된 원고"]],
       body:"환경에 맞는 정적/호스팅 방식을 고릅니다. 반응형 읽기·내비게이션·메타데이터·접근성·자산 라이선스·링크를 검증합니다.",
       gate:"배포는 별도로 승인된 작업"}}
  ],
  edges:[
    {f:"MAP", t:"B", cat:"map", label:"상태·근거 기록"},
    {f:"B", t:"R", cat:"main"},
    {f:"R", t:"P", cat:"main"},
    {f:"P", t:"D", cat:"main"},
    {f:"D", t:"Q", cat:"main"},
    {f:"Q", t:"REL", cat:"main"},
    {f:"REL", t:"PRES", cat:"optional", fs:"left", label:"선택"},
    {f:"REL", t:"WEB", cat:"optional", fs:"right", label:"선택"}
  ],
  catColor:{ main:"#8291aa", map:"#64748b", optional:"#14b8a6" }
};

/* ---------------- engine ---------------- */
const SVGNS="http://www.w3.org/2000/svg";
const NW=232, NH=64, DW=170, DH=96, GW=250, GH=70;
const el=(t,a={})=>{const e=document.createElementNS(SVGNS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};
const root=document.documentElement;
const svg=document.getElementById("diagram");
const byId=Object.fromEntries(WF.nodes.map(n=>[n.id,n]));

function dims(n){
  if(n.shape==="diamond") return {w:DW,h:DH};
  if(n.shape==="gate") return {w:GW,h:GH};
  return {w:NW,h:NH};
}
function box(n){const d=dims(n); return {x:n.cx-d.w/2, y:n.y, w:d.w, h:d.h, cx:n.cx, cy:n.y+d.h/2};}
function anchor(n, side){
  const b=box(n);
  if(n.shape==="diamond"){
    if(side==="top") return [b.cx, b.y];
    if(side==="bottom") return [b.cx, b.y+b.h];
    if(side==="left") return [b.x, b.cy];
    if(side==="right") return [b.x+b.w, b.cy];
  }
  if(side==="top") return [b.cx, b.y];
  if(side==="bottom") return [b.cx, b.y+b.h];
  if(side==="left") return [b.x, b.cy];
  if(side==="right") return [b.x+b.w, b.cy];
  return [b.cx, b.cy];
}
function pathFor(e){
  const a=byId[e.f], b=byId[e.t];
  const fs=e.fs||"bottom", ts=e.ts||"top";
  const [x0,y0]=anchor(a,fs), [x1,y1]=anchor(b,ts);
  let mid;
  if(fs==="left"||fs==="right"){
    // horizontal out, then vertical into target top
    return {d:`M ${x0} ${y0} H ${x1} V ${y1}`, lx:(x0+x1)/2, ly:y0-8};
  }
  if(Math.abs(x0-x1)<2){
    return {d:`M ${x0} ${y0} L ${x1} ${y1}`, lx:x0+8, ly:(y0+y1)/2};
  }
  mid=y0+(y1-y0)/2;
  return {d:`M ${x0} ${y0} V ${mid} H ${x1} V ${y1}`, lx:x1, ly:mid-8};
}

// adjacency for hover highlight
const adj={}; WF.nodes.forEach(n=>adj[n.id]=new Set());
WF.edges.forEach((e,i)=>{ adj[e.f].add("n:"+e.t); adj[e.t].add("n:"+e.f); adj[e.f].add("e:"+i); adj[e.t].add("e:"+i); });

let vp; // viewport group
function render(){
  const preset=root.getAttribute("data-preset");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  svg.setAttribute("viewBox",`0 0 ${WF.meta.w} ${WF.meta.h}`);
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");

  const cs=getComputedStyle(root);
  const surface=cs.getPropertyValue("--surface").trim();
  const text=cs.getPropertyValue("--text").trim();
  const muted=cs.getPropertyValue("--muted").trim();
  const line=cs.getPropertyValue("--line").trim();
  const grid=cs.getPropertyValue("--grid").trim();
  const isBlue=preset==="blueprint";
  const isSignal=preset==="signal";
  const mono="#3aa0e6";

  // in-svg style (interactivity + export safety)
  const st=el("style");
  st.textContent=`.dim{opacity:.14}.edge.dim{opacity:.07}.node,.edge,.edgelabel{transition:opacity .18s}.node.sel .card{stroke-width:2.6px}.trace .edge path.flow{stroke-dasharray:7 9;animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-32}}`;
  svg.appendChild(st);

  // defs: arrow markers per category color
  const defs=el("defs");
  const cats=WF.catColor;
  Object.keys(cats).forEach(k=>{
    const col=isBlue?(k==="gate"?cats.gate:mono):cats[k];
    const m=el("marker",{id:"arw-"+k, viewBox:"0 0 10 10", refX:"8.5", refY:"5", markerWidth:"7", markerHeight:"7", orient:"auto-start-reverse"});
    m.appendChild(el("path",{d:"M0 0 L10 5 L0 10 z", fill:col}));
    defs.appendChild(m);
  });
  if(isSignal){
    const f=el("filter",{id:"glow", x:"-40%", y:"-40%", width:"180%", height:"180%"});
    f.appendChild(el("feGaussianBlur",{stdDeviation:"2.4", result:"b"}));
    const mg=el("feMerge"); mg.appendChild(el("feMergeNode",{in:"b"})); mg.appendChild(el("feMergeNode",{in:"SourceGraphic"}));
    f.appendChild(mg); defs.appendChild(f);
  }
  svg.appendChild(defs);

  vp=el("g",{id:"viewport"});
  svg.appendChild(vp);

  // grid (blueprint)
  if(grid && grid!=="transparent"){
    const g=el("g",{class:"gridlayer"});
    for(let x=0;x<=WF.meta.w;x+=40) g.appendChild(el("line",{x1:x,y1:0,x2:x,y2:WF.meta.h,stroke:grid,"stroke-width":x%200===0?1:.5}));
    for(let y=0;y<=WF.meta.h;y+=40) g.appendChild(el("line",{x1:0,y1:y,x2:WF.meta.w,y2:y,stroke:grid,"stroke-width":y%200===0?1:.5}));
    vp.appendChild(g);
  }

  // edges
  const eLayer=el("g"); vp.appendChild(eLayer);
  WF.edges.forEach((e,i)=>{
    const col=isBlue?(e.cat==="gate"?cats.gate:mono):cats[e.cat];
    const g=el("g",{class:"edge","data-ei":i});
    const p=pathFor(e);
    const path=el("path",{class:"flow", d:p.d, stroke:col, "stroke-width":e.cat==="muted"?1.8:2.2,
      "stroke-linejoin":"round","stroke-linecap":"round","marker-end":"url(#arw-"+e.cat+")"});
    if(e.cat==="muted") path.setAttribute("stroke-dasharray","2 6");
    if(isSignal) path.setAttribute("filter","url(#glow)");
    g.appendChild(path);
    if(e.label){
      const lg=el("g",{class:"edgelabel"});
      const tw=e.label.length*11+12;
      lg.appendChild(el("rect",{x:p.lx-tw/2, y:p.ly-11, width:tw, height:18, rx:9, fill:surface, stroke:line, "stroke-width":1, opacity:.96}));
      const tx=el("text",{x:p.lx, y:p.ly+2.5, "text-anchor":"middle", "font-size":11, fill:muted, "font-weight":600}); tx.textContent=e.label;
      lg.appendChild(tx); g.appendChild(lg);
    }
    eLayer.appendChild(g);
  });

  // nodes
  const nLayer=el("g"); vp.appendChild(nLayer);
  WF.nodes.forEach(n=>{
    const b=box(n);
    const kc=WF.kinds[n.kind];
    let accent=kc.c;
    if(isBlue && n.kind!=="gate") accent=mono;
    const g=el("g",{class:"node","data-id":n.id, tabindex:"0", role:"button"});
    g.setAttribute("aria-label", n.lines.join(" ")+" — "+kc.ko);

    if(n.shape==="diamond"){
      const cx=b.cx, cy=b.cy;
      const poly=el("polygon",{class:"card",
        points:`${cx},${b.y} ${b.x+b.w},${cy} ${cx},${b.y+b.h} ${b.x},${cy}`,
        fill:surface, stroke:accent, "stroke-width":1.6});
      if(isSignal) poly.setAttribute("filter","url(#glow)");
      g.appendChild(poly);
    } else if(n.shape==="gate"){
      const r=el("rect",{class:"card", x:b.x, y:b.y, width:b.w, height:b.h, rx:12,
        fill:isSignal?"#2a0d12":(root.getAttribute("data-theme")==="light"?"#fff1f2":"#2a1417"),
        stroke:accent, "stroke-width":2.2});
      if(isSignal) r.setAttribute("filter","url(#glow)");
      g.appendChild(r);
      g.appendChild(el("rect",{x:b.x, y:b.y, width:6, height:b.h, rx:3, fill:accent}));
    } else {
      const r=el("rect",{class:"card", x:b.x, y:b.y, width:b.w, height:b.h, rx:12,
        fill:surface, stroke:accent, "stroke-width":1.4, "stroke-opacity":isBlue?.9:.55});
      if(isSignal) r.setAttribute("filter","url(#glow)");
      g.appendChild(r);
      g.appendChild(el("rect",{x:b.x, y:b.y+10, width:5, height:b.h-20, rx:2.5, fill:accent}));
    }

    // label lines
    const lines=n.lines;
    const startY=b.cy-((lines.length-1)*9);
    lines.forEach((ln,li)=>{
      const t=el("text",{x:b.cx + (n.shape==="rect"||!n.shape?6:0), y:startY+li*18+5,
        "text-anchor":"middle", "font-size":n.shape==="gate"?14:13.5,
        "font-weight":n.kind==="gate"||n.kind==="milestone"?700:600, fill:text});
      t.textContent=ln; g.appendChild(t);
    });

    nLayer.appendChild(g);
  });

  applyTrace();
  wireNodes();
  restoreTransform();
}

/* ---- interactivity ---- */
function clearHi(){
  svg.querySelectorAll(".node,.edge").forEach(x=>x.classList.remove("dim"));
}
function highlight(id){
  const keep=new Set(["n:"+id]); adj[id].forEach(k=>keep.add(k));
  svg.querySelectorAll(".node").forEach(x=>{ if(!keep.has("n:"+x.dataset.id)) x.classList.add("dim"); });
  svg.querySelectorAll(".edge").forEach(x=>{ if(!keep.has("e:"+x.dataset.ei)) x.classList.add("dim"); });
}
let selId=null;
function select(id){
  selId=id;
  svg.querySelectorAll(".node").forEach(x=>x.classList.toggle("sel", x.dataset.id===id));
  renderDetail(byId[id]);
}
function wireNodes(){
  svg.querySelectorAll(".node").forEach(g=>{
    const id=g.dataset.id;
    g.addEventListener("mouseenter",()=>{ if(!panning) highlight(id); });
    g.addEventListener("mouseleave",()=>{ if(!panning) clearHi(); });
    g.addEventListener("click",ev=>{ ev.stopPropagation(); select(id); });
    g.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); select(id);} });
  });
  if(selId) svg.querySelectorAll(".node").forEach(x=>x.classList.toggle("sel", x.dataset.id===selId));
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function renderDetail(n){
  const kc=WF.kinds[n.kind], d=n.detail||{};
  let h="";
  h+=`<p class="p-kicker">${esc(d.kicker||kc.ko)}</p>`;
  h+=`<p class="p-title">${esc(n.lines.join(" "))}</p>`;
  h+=`<div class="p-meta"><span class="tag"><span class="sw" style="width:9px;height:9px;border-radius:3px;background:${kc.c}"></span>${esc(kc.ko)}</span>`;
  (d.tags||[]).forEach(t=>{ h+=`<span class="tag"><b>${esc(t[0])}</b> ${esc(t[1])}</span>`; });
  h+=`</div>`;
  if(d.body) h+=`<p class="p-body">${esc(d.body)}</p>`;
  if(d.list&&d.list.length){ h+=`<div class="p-sec"><h4>선택 항목</h4><ul class="p-list">`; d.list.forEach(x=>h+=`<li>${esc(x)}</li>`); h+=`</ul></div>`; }
  if(d.artifacts&&d.artifacts.length){ h+=`<div class="p-sec"><h4>산출물</h4><ul class="p-list">`; d.artifacts.forEach(x=>h+=`<li><code class="path">${esc(x)}</code></li>`); h+=`</ul></div>`; }
  if(d.gate){ h+=`<div class="p-sec"><h4>완료 게이트 / 근거</h4><p class="p-body" style="margin:0">${esc(d.gate)}</p></div>`; }
  document.getElementById("detail").innerHTML=h;
}
function renderLegend(){
  const keys=Object.keys(WF.kinds);
  let h=`<h4>범례</h4><div class="row">`;
  keys.forEach(k=>{ const kc=WF.kinds[k]; h+=`<span class="li"><span class="sw" style="background:${kc.c}"></span>${esc(kc.ko)}</span>`; });
  h+=`</div>`;
  document.getElementById("legend").innerHTML=h;
}

/* ---- pan / zoom ---- */
let tx=0,ty=0,k=1, panning=false, sx=0,sy=0, moved=false;
function applyTransform(){ if(vp) vp.setAttribute("transform",`translate(${tx} ${ty}) scale(${k})`); }
function restoreTransform(){ applyTransform(); }
function resetView(){ tx=0;ty=0;k=1; applyTransform(); }
svg.addEventListener("wheel",ev=>{
  ev.preventDefault();
  const rect=svg.getBoundingClientRect();
  const vb=WF.meta.w/rect.width; // svg user units per px (x); assume uniform via viewBox meet
  const scaleY=WF.meta.h/rect.height;
  const s=Math.max(vb,scaleY);
  const px=(ev.clientX-rect.left)*s, py=(ev.clientY-rect.top)*s;
  const f=ev.deltaY<0?1.12:1/1.12;
  const nk=Math.min(4,Math.max(.4,k*f));
  tx=px-(px-tx)*(nk/k); ty=py-(py-ty)*(nk/k); k=nk; applyTransform();
},{passive:false});
svg.addEventListener("pointerdown",ev=>{
  if(ev.target.closest(".node")) return;
  panning=true; moved=false; sx=ev.clientX; sy=ev.clientY; svg.classList.add("grab"); svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove",ev=>{
  if(!panning) return;
  const rect=svg.getBoundingClientRect(); const s=Math.max(WF.meta.w/rect.width,WF.meta.h/rect.height);
  const dx=(ev.clientX-sx)*s, dy=(ev.clientY-sy)*s;
  if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>4) moved=true;
  tx+=dx; ty+=dy; sx=ev.clientX; sy=ev.clientY; applyTransform();
});
function endPan(ev){ if(panning){ panning=false; svg.classList.remove("grab"); } }
svg.addEventListener("pointerup",endPan);
svg.addEventListener("pointercancel",endPan);
svg.addEventListener("click",ev=>{ if(!ev.target.closest(".node") && !moved){ /* click empty: keep selection */ } });

/* ---- controls ---- */
let traceOn=false;
function applyTrace(){ svg.classList.toggle("trace",traceOn); }
document.getElementById("trace").addEventListener("click",e=>{
  traceOn=!traceOn; e.currentTarget.classList.toggle("on",traceOn); applyTrace();
});
document.getElementById("theme").addEventListener("click",e=>{
  const cur=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",cur);
  e.currentTarget.innerHTML=cur==="dark"?'🌙 <span>Dark</span>':'☀️ <span>Light</span>';
  render();
});
document.getElementById("preset").addEventListener("change",e=>{
  root.setAttribute("data-preset",e.target.value); render();
});
document.getElementById("reset").addEventListener("click",resetView);

/* ---- export ---- */
function serialize(){
  const clone=svg.cloneNode(true);
  clone.removeAttribute("class");
  clone.querySelectorAll(".dim,.sel").forEach(x=>x.classList.remove("dim","sel"));
  const cs=getComputedStyle(root);
  const bg=cs.getPropertyValue("--bg").trim();
  const bgRect=el("rect",{x:0,y:0,width:WF.meta.w,height:WF.meta.h,fill:bg});
  clone.insertBefore(bgRect, clone.firstChild.nextSibling);
  clone.setAttribute("width",WF.meta.w); clone.setAttribute("height",WF.meta.h);
  return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);
}
function dl(name,blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
document.getElementById("svgbtn").addEventListener("click",()=>{
  dl("book-publisher-workflow.svg", new Blob([serialize()],{type:"image/svg+xml"}));
});
document.getElementById("pngbtn").addEventListener("click",()=>{
  const scale=2, s=serialize();
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas"); c.width=WF.meta.w*scale; c.height=WF.meta.h*scale;
    const ctx=c.getContext("2d"); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    c.toBlob(b=>dl("book-publisher-workflow.png",b),"image/png");
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
});

/* ---- boot ---- */
if(WF.meta.doctitle) document.title=WF.meta.doctitle;
if(WF.meta.title) document.querySelector(".brand h1").textContent=WF.meta.title;
if(WF.meta.subtitle) document.querySelector(".brand p").textContent=WF.meta.subtitle;
if(WF.meta.foot) document.getElementById("footnote").textContent=WF.meta.foot;
renderLegend();
render();
window.__wfReady=true;
</script>
